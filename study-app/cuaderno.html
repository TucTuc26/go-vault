<title>Cuaderno de Estudio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Layout: one narrow study column (max 760px) with a sticky header; notebook-ink palette with a highlighter accent. */
:root {
  --bg: #F3F5FB;
  --surface: #FFFFFF;
  --surface-2: #E9ECF7;
  --ink: #1A2141;
  --muted: #555E82;
  --line: #D6DBEC;
  --accent: #2E3BB5;
  --accent-fg: #FFFFFF;
  --hl: #FFE14D;
  --hl-ink: #1A2141;
  --good: #187A50;
  --good-bg: #DDF3E8;
  --bad: #B42D42;
  --bad-bg: #FBE3E7;
  --warn-bg: #FFF4C7;
  --shadow: 0 1px 2px rgba(26,33,65,.06), 0 6px 20px rgba(26,33,65,.06);
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1222; --surface: #161B31; --surface-2: #1E2440; --ink: #E7E9F6; --muted: #A3AACB; --line: #2B3255;
    --accent: #919BFF; --accent-fg: #0E1222; --hl: #E3C83E; --hl-ink: #0E1222;
    --good: #5ACF97; --good-bg: #14352A; --bad: #F27D8C; --bad-bg: #3A1820; --warn-bg: #3A3216;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1222; --surface: #161B31; --surface-2: #1E2440; --ink: #E7E9F6; --muted: #A3AACB; --line: #2B3255;
  --accent: #919BFF; --accent-fg: #0E1222; --hl: #E3C83E; --hl-ink: #0E1222;
  --good: #5ACF97; --good-bg: #14352A; --bad: #F27D8C; --bad-bg: #3A1820; --warn-bg: #3A3216;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; }
h2 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 1.08rem; font-weight: 700; }
p { margin: 0; }
.mark { background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 92%, transparent 92%); padding: 0 .1em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 4px 0; cursor: pointer; min-width: 0; white-space: nowrap; }
.brand span { overflow: hidden; text-overflow: ellipsis; }
.brand .short { display: none; }
#engine-chip { white-space: nowrap; flex: none; }
.brand svg { flex: none; }
.spacer { flex: 1; }
main.wrap { padding-block: 20px 64px; display: grid; gap: 20px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 700; text-decoration: none; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .9rem; border-radius: 10px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: .88rem; font-weight: 700; cursor: pointer; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.chip.on .dot { background: var(--good); }
.chip.off .dot { background: var(--bad); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.muted { color: var(--muted); }
.small-text { font-size: .9rem; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; color: var(--muted); }
.badge { display: inline-block; font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--hl); color: var(--hl-ink); }

.hero { display: grid; gap: 10px; }
.hero p { max-width: 60ch; color: var(--muted); }

.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.subject { text-align: left; cursor: pointer; display: grid; gap: 10px; border-top: 6px solid var(--sc, var(--accent)); }
.subject:hover { border-color: var(--accent); border-top-color: var(--sc, var(--accent)); }
.counts { display: flex; gap: 14px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.counts b { color: var(--ink); }
.new-subject { border-style: dashed; box-shadow: none; display: grid; gap: 10px; }

.tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tab { flex: none; min-height: 44px; padding: 0 14px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 700; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--hl); }
.tab .n { font-variant-numeric: tabular-nums; font-weight: 400; margin-left: 4px; }

.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; display: grid; gap: 8px; justify-items: center; background: var(--surface); cursor: pointer; }
.drop.over { border-color: var(--accent); background: var(--surface-2); }
.drop input { display: none; }
textarea, input[type="text"], input[type="password"], select { width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); }
textarea { min-height: 140px; resize: vertical; }
label.field { display: grid; gap: 6px; font-weight: 700; font-size: .92rem; }
label.field .hint { font-weight: 400; color: var(--muted); }

.mat { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.mat:last-child { border-bottom: 0; }
.mat .info { flex: 1; min-width: 0; }
.mat .name { font-weight: 700; overflow-wrap: anywhere; }
.mat input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.kind { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); font-size: .72rem; font-weight: 700; color: var(--muted); }

.gen { display: grid; gap: 14px; background: var(--surface-2); border: 0; box-shadow: none; }
.gen .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.notice { padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); font-size: .92rem; }
.notice.err { background: var(--bad-bg); color: var(--ink); }
.working { display: flex; gap: 12px; align-items: center; }
.spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin .9s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

.item { display: flex; gap: 12px; align-items: center; }
.item .info { flex: 1; min-width: 0; }
.item .title { font-weight: 700; overflow-wrap: anywhere; }

.guide { display: grid; gap: 22px; }
.guide section { display: grid; gap: 8px; }
.guide ul, .guide ol { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.guide .example { border-left: 4px solid var(--hl); padding: 6px 12px; background: var(--surface-2); border-radius: 0 10px 10px 0; }
.glossary { display: grid; gap: 10px; margin: 0; }
.glossary div { display: grid; gap: 2px; }
.glossary dt { font-weight: 700; }
.glossary dd { margin: 0; color: var(--muted); }
.topic-n { font-family: var(--font-display); color: var(--muted); font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }

.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > div { height: 100%; background: var(--accent); transition: width .25s; }
.q { font-size: 1.2rem; font-weight: 700; font-family: var(--font-display); line-height: 1.3; }
.opt { width: 100%; text-align: left; min-height: 52px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .letter { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt[disabled] { cursor: default; }
.explain { padding: 12px 14px; border-radius: 12px; background: var(--surface-2); }
.score { font-family: var(--font-display); font-size: 3rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }

.flash-wrap { perspective: 1200px; }
.flash { position: relative; width: 100%; min-height: 260px; border: 0; padding: 0; background: none; cursor: pointer; transform-style: preserve-3d; transition: transform .45s; display: block; }
.flash.flipped { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; padding: 28px 22px; text-align: center; font-size: 1.15rem; overflow-wrap: anywhere; overflow-y: auto; }
.face.back { transform: rotateY(180deg); background: var(--surface-2); }
.face .tag { position: absolute; top: 12px; left: 14px; }
.face .txt { white-space: pre-wrap; }
.boxes { display: flex; gap: 6px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

dialog { border: 1px solid var(--line); border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); }
dialog::backdrop { background: rgba(10, 14, 30, .55); }
dialog .inner { padding: 20px; display: grid; gap: 16px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.radio input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
.radio.disabled { opacity: .55; cursor: not-allowed; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 700; z-index: 20; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
@media (prefers-reduced-motion: reduce) { .flash, .progress > div { transition: none; } .spin { animation-duration: 2.5s; } }
@media (max-width: 480px) { h1 { font-size: 1.6rem; } .card { padding: 14px; } .brand .long { display: none; } .brand .short { display: inline; } }
</style>

<header class="topbar">
  <div class="wrap">
    <button class="brand" id="brand" type="button" aria-label="Ir a mis materias">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="2" width="18" height="22" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h10M7 13h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 18.5l7-7" stroke="var(--hl)" stroke-width="5" stroke-linecap="round"/></svg>
      <span class="long">Cuaderno de Estudio</span><span class="short">Cuaderno</span>
    </button>
    <span class="spacer"></span>
    <button class="chip" id="engine-chip" type="button"><span class="dot"></span><span id="engine-label">Conectando…</span></button>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<dialog id="settings"></dialog>

<script>
(() => {
"use strict";

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "style") el.setAttribute("style", v);
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else if (k === "value") el.value = v;
    else if (k === "checked") el.checked = !!v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const fmtDate = (t) => new Date(t).toLocaleDateString("es", { day: "numeric", month: "short" });
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;
let toastTimer;
function toast(msg) {
  document.querySelectorAll(".toast").forEach((t) => t.remove());
  const t = h("div", { class: "toast", role: "status", text: msg });
  document.body.append(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 3200);
}
function confirmBtn(label, onConfirm, cls = "btn small danger") {
  const b = h("button", { class: cls, type: "button", text: label });
  let armed = false, timer;
  b.addEventListener("click", () => {
    if (!armed) { armed = true; b.classList.add("armed"); b.textContent = "¿Seguro? Toca otra vez"; timer = setTimeout(() => { armed = false; b.classList.remove("armed"); b.textContent = label; }, 3500); return; }
    clearTimeout(timer); onConfirm();
  });
  return b;
}
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector(`script[src="${src}"]`)) return res();
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = () => rej(new Error("No se pudo cargar " + src));
    document.head.append(s);
  });
}
function blobToBase64(blob) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
}

/* ---------- storage (IndexedDB, per device) ---------- */
const DB = {
  db: null, ok: false, mem: { subjects: new Map(), blobs: new Map() },
  async open() {
    try {
      this.db = await Promise.race([
        new Promise((res, rej) => {
          const r = indexedDB.open("cuaderno-estudio", 1);
          r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("subjects", { keyPath: "id" }); d.createObjectStore("blobs"); };
          r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000)),
      ]);
      this.ok = true;
    } catch { this.ok = false; }
  },
  req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async allSubjects() { if (!this.ok) return [...this.mem.subjects.values()]; try { return await this.req("subjects", "readonly", (s) => s.getAll()); } catch { return []; } },
  async putSubject(sub) { const copy = JSON.parse(JSON.stringify(sub)); if (!this.ok) { this.mem.subjects.set(sub.id, copy); return; } try { await this.req("subjects", "readwrite", (s) => s.put(copy)); } catch (e) { toast("No se pudo guardar: " + (e && e.name === "QuotaExceededError" ? "el navegador se quedó sin espacio" : "error del navegador")); } },
  async delSubject(id) { if (!this.ok) { this.mem.subjects.delete(id); return; } try { await this.req("subjects", "readwrite", (s) => s.delete(id)); } catch {} },
  async putBlob(id, blob) { if (!this.ok) { this.mem.blobs.set(id, blob); return; } try { await this.req("blobs", "readwrite", (s) => s.put(blob, id)); } catch {} },
  async getBlob(id) { if (!this.ok) return this.mem.blobs.get(id); try { return await this.req("blobs", "readonly", (s) => s.get(id)); } catch { return null; } },
  async delBlob(id) { if (!this.ok) { this.mem.blobs.delete(id); return; } try { await this.req("blobs", "readwrite", (s) => s.delete(id)); } catch {} },
  async clear() { if (!this.ok) { this.mem.subjects.clear(); this.mem.blobs.clear(); return; } try { await this.req("subjects", "readwrite", (s) => s.clear()); await this.req("blobs", "readwrite", (s) => s.clear()); } catch {} },
};

/* ---------- AI engines ---------- */
const MAX_CHARS = 150000;
const CLAUDE_FALLBACK_MODELS = ["claude-opus-5-5", "claude-opus-5", "claude-fable-5-2", "claude-fable-5-1", "claude-sonnet-5-5"];
const settings = Object.assign({ provider: "", geminiKey: "", geminiModel: "gemini-flash-latest", anthropicKey: "", anthropicModel: "claude-opus-5-5" }, ls.get("cuaderno-settings", {}));
const saveSettings = () => ls.set("cuaderno-settings", settings);
const IS_STANDALONE = !(window.claude && typeof window.claude.use === "function");
// A setup link like  https://…/#gemini=KEY  stores the key on this device and is then removed from the address bar.
let importedFromLink = false;
try {
  const m = location.hash.match(/^#(gemini|claude)=([A-Za-z0-9_.\-]{20,200})$/);
  if (m && IS_STANDALONE) {
    if (m[1] === "gemini") { settings.geminiKey = m[2]; settings.provider = "gemini"; }
    else { settings.anthropicKey = m[2]; settings.provider = "anthropic"; }
    saveSettings(); importedFromLink = true;
    history.replaceState(null, "", location.pathname + location.search);
  }
} catch {}

const SAMPLE_ERRORS = {
  not_granted: "No se dio permiso para usar Claude en esta página. Puedes usar una clave propia en Ajustes.",
  sampling_disabled: "Claude no está disponible para esta cuenta. Puedes usar una clave propia en Ajustes.",
  rate_limited: "Llegaste al límite de uso de Claude por ahora. Espera un rato o usa una clave propia en Ajustes.",
  session_expired: "Tu sesión de Claude expiró. Vuelve a iniciar sesión en claude.ai.",
  prompt_too_large: "El material es demasiado largo. Desmarca algunos archivos e inténtalo de nuevo.",
  refused: "Claude no quiso procesar este material. Prueba con otro archivo o con otro enfoque.",
  empty_completion: "Claude no devolvió nada. Prueba con menos material o una cantidad menor.",
  invalid_json: "La respuesta llegó incompleta. Pide menos preguntas o tarjetas y vuelve a intentar.",
  image_rejected: "Una de las imágenes no se pudo leer. Prueba con otra foto.",
  images_unavailable: "Esta vista no puede enviar imágenes a Claude. Se usó solo el texto.",
};

const AI = {
  sample: null, limits: null, checked: false,
  async init() {
    if (window.claude && typeof window.claude.use === "function") {
      try { this.sample = await window.claude.use("sample"); } catch { this.sample = null; }
      if (this.sample) { try { this.limits = await this.sample.limits(); } catch { this.limits = null; } }
    }
    this.checked = true;
    if (!settings.provider || (settings.provider === "claude" && !this.sample)) settings.provider = this.sample ? "claude" : (settings.anthropicKey ? "anthropic" : "gemini");
    updateEngineChip();
  },
  provider() { return settings.provider; },
  ready() {
    const p = settings.provider;
    if (p === "claude") return !!this.sample;
    if (p === "gemini") return !!settings.geminiKey.trim();
    if (p === "anthropic") return !!settings.anthropicKey.trim();
    return false;
  },
  label() {
    if (!this.checked) return "Conectando…";
    const p = settings.provider;
    if (p === "claude") return this.sample ? "Claude · tu cuenta" : "Configurar motor";
    if (p === "gemini") return settings.geminiKey ? "Gemini · tu clave" : "Configurar motor";
    if (p === "anthropic") return settings.anthropicKey ? "Claude · tu clave" : "Configurar motor";
    return "Configurar motor";
  },
  maxImages() {
    const p = settings.provider;

  },
  async json(prompt, images, signal) {

    if (p === "claude") {

const GEMINI_BASE = "https://generativelanguage.googleapis.com/v1beta";
// When the configured model is gone (Google retires model names), pick the newest "flash" model the key can use.
async function pickGeminiModel(signal) {
  try {
    const r = await fetch(`${GEMINI_BASE}/models?pageSize=200`, { headers: { "x-goog-api-key": settings.geminiKey.trim() }, signal });
    const d = await r.json();
    const names = (d.models || []).filter((m) => (m.supportedGenerationMethods || []).includes("generateContent")).map((m) => String(m.name).replace(/^models\//, ""));
    const score = (n) => (/flash/.test(n) ? 10 : /pro/.test(n) ? 5 : 0) - (/lite|image|tts|live|audio|embed|exp|thinking|robotics|computer/.test(n) ? 20 : 0) - (/preview/.test(n) ? 3 : 0);
    const ver = (n) => parseFloat((n.match(/(\d+(?:\.\d+)?)/) || [0, 0])[1]);
    names.sort((a, b) => score(b) - score(a) || ver(b) - ver(a));
    return names.length && score(names[0]) > 0 ? names[0] : "";
  } catch (e) { if (e && e.name === "AbortError") throw e; return ""; }
}
async function callGemini(prompt, images, signal) {
  const parts = [];
  for (const b of images) parts.push({ inline_data: { mime_type: b.type || "image/jpeg", data: await blobToBase64(b) } });
  parts.push({ text: prompt });
  let model = (settings.geminiModel || "gemini-flash-latest").trim();
  const send = async (mdl) => {
    try {
      return await fetch(`${GEMINI_BASE}/models/${encodeURIComponent(mdl)}:generateContent`, {
        method: "POST", signal,
        headers: { "content-type": "application/json", "x-goog-api-key": settings.geminiKey.trim() },
        body: JSON.stringify({ contents: [{ role: "user", parts }], generationConfig: { responseMimeType: "application/json" } }),
      });
    } catch (e) { if (e.name === "AbortError") throw e; throw new Error("No hay conexión con Gemini. Revisa tu internet."); }
  };
  let res = await send(model);
  if (res.status === 404) {
    const alt = await pickGeminiModel(signal);
    if (alt && alt !== model) { model = alt; settings.geminiModel = alt; saveSettings(); res = await send(model); }
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || res.statusText;
    if (res.status === 400 && /API key/i.test(msg)) throw new Error("La clave de Gemini no es válida. Revísala en Ajustes.");
    if (res.status === 429) throw new Error("Gemini dice que se alcanzó el límite gratis por ahora. Espera un minuto y vuelve a intentar.");
    if (res.status === 404) throw new Error(`El modelo «${model}» no existe para tu clave. Cambia el modelo en Ajustes.`);
    throw new Error("Gemini respondió con un error: " + msg);
  }
  if (data.promptFeedback && data.promptFeedback.blockReason) throw new Error("Gemini bloqueó este material. Prueba con otro archivo.");
  const cand = data.candidates && data.candidates[0];
  const text = cand && cand.content && (cand.content.parts || []).map((x) => x.text || "").join("");
  if (!text) throw new Error("Gemini no devolvió texto. Intenta de nuevo con menos material.");
  if (cand.finishReason === "MAX_TOKENS") throw new Error("La respuesta se cortó por larga. Pide menos preguntas o tarjetas.");
  return text;
}

async function callAnthropic(prompt, images, signal) {
  const content = [];
  for (const b of images) content.push({ type: "image", source: { type: "base64", media_type: b.type || "image/jpeg", data: await blobToBase64(b) } });
  content.push({ type: "text", text: prompt });
  const model = (settings.anthropicModel || "claude-opus-5-5").trim();
  const body = { model, max_tokens: 16000, messages: [{ role: "user", content }] };
  const headers = { "content-type": "application/json", "x-api-key": settings.anthropicKey.trim(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" };
  if (CLAUDE_FALLBACK_MODELS.includes(model)) { headers["anthropic-beta"] = "server-side-fallback-2026-07-01"; body.fallbacks = "default"; }
  let res;
  try { res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal, headers, body: JSON.stringify(body) }); }
  catch (e) { if (e.name === "AbortError") throw e; throw new Error("No hay conexión con la API de Claude. Revisa tu internet."); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || res.statusText;
    if (res.status === 401) throw new Error("La clave de la API de Claude no es válida. Revísala en Ajustes.");
    if (res.status === 429) throw new Error("Se alcanzó el límite de la API por ahora. Espera un minuto.");
    if (res.status === 400 && /credit|billing/i.test(msg)) throw new Error("La cuenta de la API no tiene saldo. Recárgala en console.anthropic.com.");
    throw new Error("La API de Claude respondió con un error: " + msg);
  }
  if (data.stop_reason === "refusal") throw new Error("Claude no quiso procesar este material. Prueba con otro archivo.");
  if (data.stop_reason === "max_tokens") throw new Error("La respuesta se cortó por larga. Pide menos preguntas o tarjetas.");
  const text = (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("");
  if (!text) throw new Error("La API no devolvió texto. Intenta de nuevo.");
  return text;
}

function parseLooseJSON(text) {
  const t = String(text || "").trim();
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = Math.min(...["{", "["].map((c) => { const i = t.indexOf(c); return i < 0 ? Infinity : i; }));
  const z = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a !== Infinity && z > a) { try { return JSON.parse(t.slice(a, z + 1)); } catch {} }
  return undefined;
}

const LIBS = {
  pdf: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js",
  pdfWorker: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js",
  jszip: "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
  mammoth: "https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js",
};

async function downscale(source, max = 1568) {
  let bmp;
  try { bmp = await createImageBitmap(source); }
  catch {
    bmp = await new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(source); });
  }
  const w = bmp.width, hgt = bmp.height, s = Math.min(1, max / Math.max(w, hgt));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(hgt * s);
  const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.85));
}

async function extractPdf(file) {
  await loadScript(LIBS.pdfWorker); await loadScript(LIBS.pdf);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  const pdf = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let s = ""; for (const it of tc.items) s += (it.str || "") + (it.hasEOL ? "\n" : " ");
    pages.push(s.replace(/[ \t]+/g, " ").trim());
  }
  const text = pages.map((p, i) => `[Página ${i + 1}]\n${p}`).join("\n\n");
  const real = pages.join("").replace(/\s/g, "").length;
  if (real >= 40 * pdf.numPages || real > 4000) return { kind: "text", text };
  // Looks scanned: render pages as images.
  const blobs = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
    const page = await pdf.getPage(i); const vp0 = page.getViewport({ scale: 1 });
    const vp = page.getViewport({ scale: Math.min(2, 1400 / vp0.width) });
    const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
    blobs.push(await new Promise((res) => c.toBlob(res, "image/jpeg", 0.8)));
  }
  return { kind: "images", blobs, note: pdf.numPages > 20 ? `PDF escaneado: se guardaron las primeras 20 de ${pdf.numPages} páginas como imágenes.` : "PDF escaneado: se guardó como imágenes." };
}
async function extractDocx(file) {
  await loadScript(LIBS.mammoth);
  const r = await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() });
  return { kind: "text", text: r.value };
}
async function extractPptx(file) {
  await loadScript(LIBS.jszip);
  const zip = await window.JSZip.loadAsync(await file.arrayBuffer());
  const slides = Object.keys(zip.files).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => parseInt(a.match(/\d+/)[0]) - parseInt(b.match(/\d+/)[0]));
  const notes = Object.keys(zip.files).filter((n) => /^ppt\/notesSlides\/notesSlide\d+\.xml$/.test(n));
  const read = async (name) => {
    const xml = new DOMParser().parseFromString(await zip.file(name).async("string"), "application/xml");
    return [...xml.getElementsByTagName("a:p")].map((p) => [...p.getElementsByTagName("a:t")].map((t) => t.textContent).join("")).filter(Boolean).join("\n");
  };
  const out = [];
  for (let i = 0; i < slides.length; i++) {
    let s = `[Diapositiva ${i + 1}]\n` + (await read(slides[i]));
    const nn = notes.find((n) => n.endsWith(`notesSlide${slides[i].match(/\d+/)[0]}.xml`));
    if (nn) { const t = (await read(nn)).trim(); if (t) s += "\nNotas: " + t; }
    out.push(s);
  }
  return { kind: "text", text: out.join("\n\n") };
}
async function extractFile(file) {
  const n = file.name.toLowerCase();
  if (n.endsWith(".pdf") || file.type === "application/pdf") return extractPdf(file);
  if (n.endsWith(".docx")) return extractDocx(file);
  if (n.endsWith(".pptx")) return extractPptx(file);
  if (file.type.startsWith("image/") || /\.(jpe?g|png|webp|gif|heic)$/.test(n)) return { kind: "images", blobs: [await downscale(file)] };
  if (/\.(txt|md|csv|tsv|json|html?|rtf|tex)$/.test(n) || file.type.startsWith("text/")) return { kind: "text", text: await file.text() };
  if (/\.(doc|ppt|xls)$/.test(n)) throw new Error(`«${file.name}» es un formato antiguo de Office. Guárdalo como .docx o .pptx (o PDF) y súbelo otra vez.`);
  throw new Error(`No sé leer «${file.name}». Usa PDF, Word (.docx), PowerPoint (.pptx), texto o fotos.`);
}

function materialBundle(sub) {
  const inc = sub.materials.filter((m) => m.include);
  let text = "", total = 0;
  for (const m of inc.filter((m) => m.kind === "text")) total += m.text.length;
  for (const m of inc.filter((m) => m.kind === "text")) {
    const chunk = `<material nombre="${m.name.replace(/"/g, "'")}">\n${m.text}\n</material>\n\n`;
    if (text.length + chunk.length > MAX_CHARS) { text += chunk.slice(0, Math.max(0, MAX_CHARS - text.length)) + "\n</material>\n"; break; }
    text += chunk;
  }
  const imageIds = inc.filter((m) => m.kind === "images").flatMap((m) => m.imageIds);
  return { text, truncated: total > MAX_CHARS, total, imageIds, count: inc.length };
}

function validate(kind, v) {
  const S = (x) => (typeof x === "string" ? x.trim() : x == null ? "" : String(x));
  const A = (x) => (Array.isArray(x) ? x : []);
  if (!v || typeof v !== "object") throw new Error("La respuesta no tiene el formato esperado. Intenta otra vez.");
  if (kind === "guide") {
    const g = { titulo: S(v.titulo) || "Guía de estudio", resumen: S(v.resumen), temas: A(v.temas).map((t) => ({ titulo: S(t && t.titulo), explicacion: S(t && t.explicacion), puntos_clave: A(t && t.puntos_clave).map(S).filter(Boolean), ejemplo: S(t && t.ejemplo) })).filter((t) => t.titulo || t.explicacion), glosario: A(v.glosario).map((x) => ({ termino: S(x && x.termino), definicion: S(x && x.definicion) })).filter((x) => x.termino), preguntas_de_repaso: A(v.preguntas_de_repaso).map(S).filter(Boolean), consejos: A(v.consejos).map(S).filter(Boolean) };
    if (!g.temas.length && !g.resumen) throw new Error("La guía llegó vacía. Revisa que el material tenga texto legible.");
    return g;
  }
  if (kind === "quiz") {
    const qs = A(v.preguntas).map((q) => { const opciones = A(q && q.opciones).map(S).filter(Boolean); let c = Number(q && q.correcta); if (!(c >= 0 && c < opciones.length)) c = -1; return { pregunta: S(q && q.pregunta), opciones, correcta: c, explicacion: S(q && q.explicacion) }; }).filter((q) => q.pregunta && q.opciones.length >= 2 && q.correcta >= 0);
    if (!qs.length) throw new Error("El quiz llegó vacío. Intenta otra vez.");
    return { titulo: S(v.titulo) || "Quiz", preguntas: qs };
  }
  const cards = A(v.tarjetas).map((c) => ({ frente: S(c && c.frente), reverso: S(c && c.reverso) })).filter((c) => c.frente && c.reverso);
  if (!cards.length) throw new Error("Las tarjetas llegaron vacías. Intenta otra vez.");
  return { titulo: S(v.titulo) || "Tarjetas", tarjetas: cards };
}

async function addFiles(s, files) {
  if (!files.length) return;
  state.fileErrors = []; state.busyFiles += files.length; render();
  for (const f of files) {
    try {
      const r = await extractFile(f);
      if (r.kind === "text") {
        const text = (r.text || "").trim();
        if (!text) throw new Error(`«${f.name}» no tiene texto legible.`);
        s.materials.push({ id: uid(), name: f.name, kind: "text", text, include: true, addedAt: Date.now() });
      } else {
        const ids = [];
        for (const b of r.blobs) { const id = uid(); await DB.putBlob(id, b); ids.push(id); }
        s.materials.push({ id: uid(), name: f.name, kind: "images", imageIds: ids, include: true, addedAt: Date.now(), note: r.note || "" });
      }
      await save(s);
    } catch (e) { state.fileErrors.push(e && e.message ? e.message : `No se pudo leer «${f.name}».`); }
    state.busyFiles--; if (state.view === "subject") render();
  }
  if (!state.fileErrors.length) toast(files.length === 1 ? "Archivo agregado" : `${files.length} archivos agregados`);
}

async function runGen(s, kind, o) {
  if (kind === "quiz") { ls.set("cuaderno-qcount", o.count); ls.set("cuaderno-qdiff", o.difficulty); }
  if (kind === "deck") ls.set("cuaderno-dcount", o.count);
  const ctl = new AbortController();
  const g = { subjectId: s.id, kind, running: true, ctl, error: "" };
  state.gen = g; render();
  try {
    const b = materialBundle(s);
    const maxImg = AI.maxImages();
    const images = [];
    for (const id of b.imageIds.slice(0, maxImg)) { const blob = await DB.getBlob(id); if (blob) images.push(blob); }
    if (!b.text && !images.length) throw new Error("No hay texto ni imágenes que el motor actual pueda leer.");
    const prompt = basePrompt(s, b, o.focus, images.length) + "\n\nTAREA:" + PROMPTS[kind](o);
    const raw = await AI.json(prompt, images, ctl.signal);
    const data = validate(kind, raw);
    const now = Date.now();
    if (kind === "guide") { const it = { id: uid(), createdAt: now, focus: o.focus, data }; s.guides.unshift(it); await save(s); state.gen = null; go("guide", { play: { id: it.id } }); }
    if (kind === "quiz") { const it = { id: uid(), createdAt: now, focus: o.focus, difficulty: o.difficulty, attempts: [], data }; s.quizzes.unshift(it); await save(s); state.gen = null; toast(`Quiz listo: ${plural(data.preguntas.length, "pregunta", "preguntas")}`); render(); }
    if (kind === "deck") { const it = { id: uid(), createdAt: now, focus: o.focus, data: { titulo: data.titulo }, cards: data.tarjetas.map((c) => ({ id: uid(), frente: c.frente, reverso: c.reverso, box: 0 })) }; s.decks.unshift(it); await save(s); state.gen = null; toast(`${plural(it.cards.length, "tarjeta lista", "tarjetas listas")}`); render(); }
  } catch (e) {
    g.running = false;
    g.error = e && e.cancelled ? "" : (e && e.message) || "Algo falló. Intenta de nuevo.";
    if (state.gen === g) render();
  }
}

/* ---------- guide reader ---------- */
function guideAsText(d) {
  const L = [d.titulo, "", d.resumen, ""];
  d.temas.forEach((t, i) => { L.push(`${i + 1}. ${t.titulo}`, t.explicacion, ...t.puntos_clave.map((p) => "  • " + p)); if (t.ejemplo) L.push("  Ejemplo: " + t.ejemplo); L.push(""); });
  if (d.glosario.length) { L.push("Glosario"); d.glosario.forEach((g) => L.push(`• ${g.termino}: ${g.definicion}`)); L.push(""); }
  if (d.preguntas_de_repaso.length) { L.push("Preguntas de repaso"); d.preguntas_de_repaso.forEach((p) => L.push("• " + p)); L.push(""); }
  if (d.consejos.length) { L.push("Consejos"); d.consejos.forEach((p) => L.push("• " + p)); }
  return L.join("\n");
}
